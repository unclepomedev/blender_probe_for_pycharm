name: Smoke (daily build)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }}, daily)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Setup blup + Blender (daily)
        uses: unclepomedev/setup-blup@bb3f2f8d206213451dcbced6663180a84a42064c # v0
        with:
          daily: true
          cache: true

      - name: Setup Mesa3D (Windows)
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72 # v3

      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run smoke tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run --auto-servernum ./gradlew smokeTest

      - name: Run smoke tests (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: ./gradlew smokeTest

      - name: Collect smoke test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-daily-result-${{ matrix.os }}
          path: build/reports/tests/smokeTest
